<svg xmlns="http://www.w3.org/2000/svg" width="170" height="64" viewBox="222 87 170 64"><style>
    
    .pf-header { animation: pf-pop 10s ease-out infinite; }
    .pf-underline { animation: pf-wipe 10s ease-out infinite; transform-origin: 36px center; }
    .pf-caption { animation: pf-pop 10s ease-out infinite; animation-delay: 0.50s; }
    .pf-tile { animation: pf-pop 10s ease-out infinite; }
    .pf-tile-0 { animation-delay: 1.20s; }
    .pf-tile-1 { animation-delay: 1.70s; }
    .pf-tile-2 { animation-delay: 2.20s; }
    .pf-tile-3 { animation-delay: 2.70s; }
    .pf-tile-4 { animation-delay: 3.20s; }
    
    .pf-heart-beat { transform-origin: 396.4px 174px; animation: pf-heartbeat 5s ease-in-out infinite; }
    @keyframes pf-pop {
      0%, 6%   { opacity: 0; transform: translateY(-4px); }
      18%, 88% { opacity: 1; transform: translateY(0); }
      100%     { opacity: 0; transform: translateY(0); }
    }
    @keyframes pf-wipe {
      0%, 10%  { transform: scaleX(0); }
      28%, 88% { transform: scaleX(1); }
      100%     { transform: scaleX(1); }
    }
    @keyframes pf-heartbeat {
      0%, 100% { transform: scale(1); }
      50%      { transform: scale(1.15); }
    }
  </style><g class="pf-tile pf-tile-1">
