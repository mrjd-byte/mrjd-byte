<svg xmlns="http://www.w3.org/2000/svg" width="170" height="64" viewBox="780 87 170 64"><style>
    
    .pf-header { animation: pf-pop 10s ease-out infinite; }
    .pf-underline { animation: pf-wipe 10s ease-out infinite; transform-origin: 36px center; }
    .pf-caption { animation: pf-pop 10s ease-out infinite; animation-delay: 0.50s; }
    .pf-tile { animation: pf-pop 10s ease-out infinite; }
    .pf-tile-0 { animation-delay: 1.20s; }
    .pf-tile-1 { animation-delay: 1.70s; }
    .pf-tile-2 { animation-delay: 2.20s; }
    .pf-tile-3 { animation-delay: 2.70s; }
    .pf-tile-4 { animation-delay: 3.20s; }
    
    .pf-heart-beat { transform-origin: 396.4px 174px; animation: pf-heartbeat 5s ease-in-out infinite; }
    @keyframes pf-pop {
      0%, 6%   { opacity: 0; transform: translateY(-4px); }
      18%, 88% { opacity: 1; transform: translateY(0); }
      100%     { opacity: 0; transform: translateY(0); }
    }
    @keyframes pf-wipe {
      0%, 10%  { transform: scaleX(0); }
      28%, 88% { transform: scaleX(1); }
      100%     { transform: scaleX(1); }
    }
    @keyframes pf-heartbeat {
      0%, 100% { transform: scale(1); }
      50%      { transform: scale(1.15); }
    }
  </style><g class="pf-tile pf-tile-4" style="animation-delay:3.20s">
    <rect x="780" y="87" width="170" height="64" fill="#3a2a14" /><rect x="781" y="88" width="168" height="62" fill="#7a4a23" /><rect x="782" y="89" width="166" height="60" fill="#3a2a14" /><rect x="783" y="90" width="164" height="58" fill="#e6d3a4" />
    <text x="865" y="116" text-anchor="middle" fill="#7a4a23" font-family="ui-monospace, monospace" font-size="18" font-weight="700" letter-spacing="0.5">LEETCODE</text>
    <text x="865" y="138" text-anchor="middle" fill="#3d2818" font-family="ui-monospace, monospace" font-size="10" font-weight="700" letter-spacing="0.2">leetcode.com/u/mrjd30/</text>
  </g>

  
  </svg>