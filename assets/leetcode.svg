
<svg xmlns="http://www.w3.org/2000/svg" width="170" height="64" viewBox="780 87 170 64">
  <style>
    .pf-tile-4 {
      animation: pf-pop 10s ease-out infinite;
      animation-delay: 3.20s;
    }
    @keyframes pf-pop {
      0%, 6% { opacity: 0; transform: translateY(-4px); }
      18%, 88% { opacity: 1; transform: translateY(0); }
      100% { opacity: 0; transform: translateY(0); }
    }
  </style>

  <!-- Exact border and background styling -->
  <g class="pf-tile-4">
    <rect x="780" y="87" width="170" height="64" fill="#3a2a14"/>
    <rect x="781" y="88" width="168" height="62" fill="#7a4a23"/>
    <rect x="782" y="89" width="166" height="60" fill="#3a2a14"/>
    <rect x="783" y="90" width="164" height="58" fill="#e6d3a4"/>

    <!-- Pixel font: each block is exactly 3x3 px -->
    <g fill="#7a4a23">

      <!-- L -->
      <g id="L">
        <rect x="0" y="0" width="3" height="3"/>
        <rect x="0" y="3" width="3" height="3"/>
        <rect x="0" y="6" width="3" height="3"/>
        <rect x="0" y="9" width="3" height="3"/>
        <rect x="0" y="12" width="3" height="3"/>
        <rect x="0" y="15" width="3" height="3"/>
        <rect x="0" y="18" width="3" height="3"/>
        <rect x="3" y="18" width="3" height="3"/>
        <rect x="6" y="18" width="3" height="3"/>
        <rect x="9" y="18" width="3" height="3"/>
        <rect x="12" y="18" width="3" height="3"/>
      </g>

      <!-- E -->
      <g id="E">
        <rect x="0" y="0" width="15" height="3"/>
        <rect x="0" y="3" width="3" height="3"/>
        <rect x="0" y="6" width="3" height="3"/>
        <rect x="3" y="9" width="12" height="3"/>
        <rect x="0" y="12" width="3" height="3"/>
        <rect x="0" y="15" width="3" height="3"/>
        <rect x="0" y="18" width="15" height="3"/>
      </g>

      <!-- T -->
      <g id="T">
        <rect x="0" y="0" width="15" height="3"/>
        <rect x="6" y="3" width="3" height="3"/>
        <rect x="6" y="6" width="3" height="3"/>
        <rect x="6" y="9" width="3" height="3"/>
        <rect x="6" y="12" width="3" height="3"/>
        <rect x="6" y="15" width="3" height="3"/>
        <rect x="6" y="18" width="3" height="3"/>
      </g>

      <!-- C -->
      <g id="C">
        <rect x="3" y="0" width="9" height="3"/>
        <rect x="0" y="3" width="3" height="3"/>
        <rect x="0" y="6" width="3" height="3"/>
        <rect x="0" y="9" width="3" height="3"/>
        <rect x="0" y="12" width="3" height="3"/>
        <rect x="0" y="15" width="3" height="3"/>
        <rect x="3" y="18" width="9" height="3"/>
      </g>

      <!-- O -->
      <g id="O">
        <rect x="3" y="0" width="9" height="3"/>
        <rect x="0" y="3" width="3" height="3"/>
        <rect x="12" y="3" width="3" height="3"/>
        <rect x="0" y="6" width="3" height="3"/>
        <rect x="12" y="6" width="3" height="3"/>
        <rect x="0" y="9" width="3" height="3"/>
        <rect x="12" y="9" width="3" height="3"/>
        <rect x="0" y="12" width="3" height="3"/>
        <rect x="12" y="12" width="3" height="3"/>
        <rect x="0" y="15" width="3" height="3"/>
        <rect x="12" y="15" width="3" height="3"/>
        <rect x="3" y="18" width="9" height="3"/>
      </g>

      <!-- D -->
      <g id="D">
        <rect x="0" y="0" width="12" height="3"/>
        <rect x="0" y="3" width="3" height="3"/>
        <rect x="12" y="3" width="3" height="3"/>
        <rect x="0" y="6" width="3" height="3"/>
        <rect x="12" y="6" width="3" height="3"/>
        <rect x="0" y="9" width="3" height="3"/>
        <rect x="12" y="9" width="3" height="3"/>
        <rect x="0" y="12" width="3" height="3"/>
        <rect x="12" y="12" width="3" height="3"/>
        <rect x="0" y="15" width="3" height="3"/>
        <rect x="12" y="15" width="3" height="3"/>
        <rect x="0" y="18" width="12" height="3"/>
      </g>

    </g>

    <!-- LEETCODE: 8 letters, 3px blocks, 3px letter spacing -->
    <g>
      <use href="#L" x="795" y="98"/>
      <use href="#E" x="813" y="98"/>
      <use href="#E" x="831" y="98"/>
      <use href="#T" x="849" y="98"/>
      <use href="#C" x="867" y="98"/>
      <use href="#O" x="885" y="98"/>
      <use href="#D" x="903" y="98"/>
      <use href="#E" x="921" y="98"/>
    </g>

    <!-- Caption: unchanged from GitHub tile -->
    <text x="865" y="138"
      text-anchor="middle"
      fill="#3d2818"
      font-family="ui-monospace, monospace"
      font-size="10"
      font-weight="700"
      letter-spacing="0.2">leetcode.com/u/mrjd30/</text>
  </g>
</svg>
